eval_cases:
  # ============================================================
  # LOW COMPLEXITY — single tool call, direct lookup
  # ============================================================

  # Flight search
  - prompt: "Find flights from SFO to JFK"
    expected_response: "I found flights from SFO to JFK: United FL001 departing 08:00 at $450, and Delta FL002 departing 10:30 at $520."
    tier: low
    category: search
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: JFK}

  - prompt: "Search for flights from LAX to Chicago"
    expected_response: "American Airlines FL003 from LAX to ORD at $380, departing 07:00."
    tier: low
    category: search
    expected_tools:
      - name: search_flights
        args: {origin: LAX, destination: ORD}

  - prompt: "Are there flights from SFO to Los Angeles?"
    expected_response: "Southwest FL005 from SFO to LAX at $150, departing 06:00."
    tier: low
    category: search
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: LAX}

  # Hotel search
  - prompt: "Search for hotels in New York"
    expected_response: "Grand Hyatt New York at $320/night (4.5 rating) and Budget Inn Downtown at $120/night (3.2 rating)."
    tier: low
    category: search
    expected_tools:
      - name: search_hotels
        args: {city: New York}

  - prompt: "Find hotels in New York under $200 per night"
    expected_response: "Budget Inn Downtown at $120/night (3.2 rating)."
    tier: low
    category: search
    expected_tools:
      - name: search_hotels
        args: {city: New York, max_price: 200}

  - prompt: "Find me a hotel in Miami"
    expected_response: "Fontainebleau Miami at $400/night with a 4.7 rating."
    tier: low
    category: search
    expected_tools:
      - name: search_hotels
        args: {city: Miami}

  # Expense policy
  - prompt: "What is the corporate meal expense limit?"
    expected_response: "The corporate meal expense limit is $75.00. Amounts exceeding this limit require manager review and approval."
    tier: low
    category: policy
    expected_tools:
      - name: check_expense_policy
        args: {category: meals, amount: 75}

  - prompt: "Is a $50 transport expense within policy?"
    expected_response: "A $50 transport expense is within the corporate policy limit of $200."
    tier: low
    category: policy
    expected_tools:
      - name: check_expense_policy
        args: {category: transport, amount: 50}

  - prompt: "What's the lodging policy limit?"
    expected_response: "The corporate lodging policy limit is $400 per night."
    tier: low
    category: policy
    expected_tools:
      - name: check_expense_policy
        args: {category: lodging, amount: 400}

  # Booking
  - prompt: "Book flight FL001 for Alice Johnson"
    expected_response: "Flight FL001 has been successfully booked for Alice Johnson. Booking confirmed."
    tier: low
    category: booking
    expected_tools:
      - name: book_flight
        args: {flight_id: FL001, passenger_name: Alice Johnson}

  # Expense history
  - prompt: "Show expenses for user EMP001"
    expected_response: "Here are the expenses for user EMP001, showing expense ID, amount, category, description, date, and approval status for each entry."
    tier: low
    category: expense
    expected_tools:
      - name: get_user_expenses
        args: {user_id: EMP001}

  # Edge cases
  - prompt: "Find flights from San Fransisco to New Yrok"
    expected_response: "I'll search for flights from SFO to JFK. I found flights: United FL001 departing 08:00 at $450, and Delta FL002 departing 10:30 at $520."
    tier: low
    category: error_handling
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: JFK}

  - prompt: "Search hotels in Atlantis"
    expected_response: "No hotels found in Atlantis. Please try a different city."
    tier: low
    category: error_handling
    expected_tools:
      - name: search_hotels
        args: {city: Atlantis}

  - prompt: "Check policy for $500 in the 'unknown' category"
    expected_response: "The category 'unknown' is not valid. Valid categories: meals, transport, lodging, supplies, entertainment."
    tier: low
    category: error_handling
    expected_tools:
      - name: check_expense_policy
        args: {category: unknown, amount: 500}

  # ============================================================
  # MEDIUM COMPLEXITY — 2 tools, comparison, or reasoning
  # ============================================================

  # Submit with policy check
  - prompt: "Submit a $45 meals expense for lunch meeting, user ID EMP001"
    expected_response: "The $45 meals expense is within the $75 corporate policy limit. The expense has been successfully submitted for EMP001 and approved."
    tier: medium
    category: expense
    expected_tools:
      - name: check_expense_policy
        args: {category: meals, amount: 45}
      - name: submit_expense
        args: {user_id: EMP001, category: meals, amount: 45, description: lunch meeting}

  # Over-limit submission
  - prompt: "Submit a $500 entertainment expense for team event, user ID EMP002"
    expected_response: "A $500 entertainment expense exceeds the $150 limit. Requires manager approval."
    tier: medium
    category: expense
    expected_tools:
      - name: check_expense_policy
        args: {category: entertainment, amount: 500}

  # Flight comparison
  - prompt: "Find flights from SFO to JFK and compare the cheapest options by airline"
    expected_response: "United FL001 at $450 vs Delta FL002 at $520. United is $70 cheaper (13.5% savings)."
    tier: medium
    category: planning
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: JFK}

  # Search + policy cross-check
  - prompt: "Search hotels in New York, then check if the nightly rate fits our lodging policy"
    expected_response: "Grand Hyatt $320/night within $400 policy. Budget Inn $120/night within policy."
    tier: medium
    category: planning
    expected_tools:
      - name: search_hotels
        args: {city: New York}
      - name: check_expense_policy
        args: {category: lodging, amount: 400}

  # Multi-category policy check
  - prompt: "Check if a $100 meal and a $250 entertainment expense are both within policy"
    expected_response: "Meals $100 exceeds $75 limit. Entertainment $250 exceeds $150 limit. Both need manager review."
    tier: medium
    category: policy
    expected_tools:
      - name: check_expense_policy
        args: {category: meals, amount: 100}
      - name: check_expense_policy
        args: {category: entertainment, amount: 250}

  # History + analysis
  - prompt: "Show expense history for EMP001 and flag any items that exceeded policy limits"
    expected_response: "Here are the expenses for EMP001. I've reviewed each against the corporate policy limits and flagged any items that exceed the allowed amounts."
    tier: medium
    category: expense
    expected_tools:
      - name: get_user_expenses
        args: {user_id: EMP001}

  # Price savings analysis
  - prompt: "Find the cheapest flight from SFO to JFK and tell me how much I'd save vs the most expensive"
    expected_response: "Cheapest: United FL001 at $450. Most expensive: Delta FL002 at $520. Savings: $70 (13.5%)."
    tier: medium
    category: planning
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: JFK}

  # Book + policy verify
  - prompt: "Book hotel HT002 for Bob Smith June 15-18, and check if the rate is within lodging policy"
    expected_response: "Hotel HT002 (Palmer House, $250/night) booked for Bob Smith. Rate within $400 lodging policy."
    tier: medium
    category: booking
    expected_tools:
      - name: book_hotel
        args: {hotel_id: HT002, guest_name: Bob Smith, checkin: "2026-06-15", checkout: "2026-06-18"}
      - name: check_expense_policy
        args: {category: lodging, amount: 250}

  # Expense submission within policy
  - prompt: "Submit a $90 supplies expense for office materials, user ID EMP003"
    expected_response: "Expense submitted: $90 supplies for EMP003. Status: approved (within $100 policy limit)."
    tier: medium
    category: expense
    expected_tools:
      - name: check_expense_policy
        args: {category: supplies, amount: 90}
      - name: submit_expense
        args: {user_id: EMP003, category: supplies, amount: 90, description: office materials}

  # ============================================================
  # HIGH COMPLEXITY — 3+ tools, cross-domain, strategic planning
  # ============================================================

  # Book + policy + expense pipeline
  - prompt: "Book flight FL001 for Alice, check if Grand Hyatt ($320) is within lodging policy, and submit a $75 meals expense for EMP001"
    expected_response: "FL001 booked for Alice. Grand Hyatt $320 within $400 policy. $75 meals submitted, approved."
    tier: high
    category: planning
    expected_tools:
      - name: book_flight
        args: {flight_id: FL001, passenger_name: Alice}
      - name: check_expense_policy
        args: {category: lodging, amount: 320}
      - name: check_expense_policy
        args: {category: meals, amount: 75}
      - name: submit_expense
        args: {user_id: EMP001, category: meals, amount: 75, description: business meal}

  # Multi-route comparison with hotels
  - prompt: "Compare flights from SFO to JFK vs LAX to ORD, and find hotels in each destination city"
    expected_response: "SFO-JFK: FL001 $450, FL002 $520. NYC hotels: Grand Hyatt $320, Budget Inn $120. LAX-ORD: FL003 $380. Chicago hotels: Palmer House $250."
    tier: high
    category: planning
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: JFK}
      - name: search_flights
        args: {origin: LAX, destination: ORD}
      - name: search_hotels
        args: {city: New York}
      - name: search_hotels
        args: {city: Chicago}

  # Budget-constrained trip planning
  - prompt: "I have a $2000 budget for a London trip. Find flights from JFK, hotels, and check lodging and meal policies. Can I afford it?"
    expected_response: "JFK-LHR: Delta FL006 at $890. London hotels: Claridge's $680/night. Lodging policy $400/night (exceeded). Meals $75/day. Budget analysis provided."
    tier: high
    category: planning
    expected_tools:
      - name: search_flights
        args: {origin: JFK, destination: LHR}
      - name: search_hotels
        args: {city: London}
      - name: check_expense_policy
        args: {category: lodging, amount: 680}
      - name: check_expense_policy
        args: {category: meals, amount: 75}

  # Review + audit + submit pipeline
  - prompt: "Review EMP002's expense history, check all policy categories, and submit a $80 supplies expense for EMP002"
    expected_response: "EMP002 history reviewed. Policy limits: meals $75, transport $200, lodging $400, supplies $100, entertainment $150. Supplies $80 submitted, approved."
    tier: high
    category: expense
    expected_tools:
      - name: get_user_expenses
        args: {user_id: EMP002}
      - name: check_expense_policy
        args: {category: supplies, amount: 80}
      - name: submit_expense
        args: {user_id: EMP002, category: supplies, amount: 80, description: office supplies}

  # End-to-end trip booking
  - prompt: "Find the cheapest SFO-JFK flight, book it for Bob Smith, find a hotel within lodging policy, and submit a pre-trip expense estimate"
    expected_response: "Cheapest: FL001 $450. Booked for Bob Smith. Grand Hyatt $320 within $400 policy. Pre-trip estimate submitted."
    tier: high
    category: planning
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: JFK}
      - name: book_flight
        args: {flight_id: FL001, passenger_name: Bob Smith}
      - name: search_hotels
        args: {city: New York}
      - name: check_expense_policy
        args: {category: lodging, amount: 320}

  # Multi-user expense audit
  - prompt: "Pull expense histories for EMP001 and EMP002, flag any policy violations, and summarize total overspend"
    expected_response: "I've pulled expense histories for both EMP001 and EMP002. After reviewing against policy limits, I've identified any violations and summarized the total overspend by category."
    tier: high
    category: expense
    expected_tools:
      - name: get_user_expenses
        args: {user_id: EMP001}
      - name: get_user_expenses
        args: {user_id: EMP002}

  # ============================================================
  # NEW CITY COVERAGE — Tokyo, Denver, Boston
  # ============================================================

  - prompt: "Find flights from SFO to Denver"
    expected_response: "United FL008 from SFO to DEN at $320, departing 09:00."
    tier: low
    category: search
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: DEN}

  - prompt: "Search for hotels in Boston"
    expected_response: "The Liberty Boston at $350/night (4.6 rating)."
    tier: low
    category: search
    expected_tools:
      - name: search_hotels
        args: {city: Boston}

  # ============================================================
  # CANCELLATION COVERAGE — cancel_booking, get_booking_details, list_all_bookings
  # ============================================================

  - prompt: "Book flight FL003 for Carol Davis, then immediately cancel the booking"
    expected_response: "Flight FL003 booked for Carol Davis. Booking has been cancelled successfully."
    tier: medium
    category: cancellation
    expected_tools:
      - name: book_flight
        args: {flight_id: FL003, passenger_name: Carol Davis}
      - name: cancel_booking
        args: {booking_id: "<runtime>"}

  - prompt: "Book hotel HT001 for Dave Wilson June 15-17, then show me the booking details"
    expected_response: "Hotel HT001 booked for Dave Wilson (June 15-17). Booking details: Grand Hyatt New York, status confirmed."
    tier: medium
    category: cancellation
    expected_tools:
      - name: book_hotel
        args: {hotel_id: HT001, guest_name: Dave Wilson, checkin: "2026-06-15", checkout: "2026-06-17"}
      - name: get_booking_details
        args: {booking_id: "<runtime>"}

  # ============================================================
  # BOUNDARY-VALUE POLICY — exact limits and one-cent-over
  # ============================================================

  - prompt: "Is a $75 meal expense within policy?"
    expected_response: "A $75 meal expense is exactly at the corporate policy limit of $75 and is within policy."
    tier: low
    category: boundary
    expected_tools:
      - name: check_expense_policy
        args: {category: meals, amount: 75}

  - prompt: "Is a $75.01 meal expense within policy?"
    expected_response: "A $75.01 meal expense exceeds the corporate policy limit of $75 by $0.01. This requires manager review."
    tier: low
    category: boundary
    expected_tools:
      - name: check_expense_policy
        args: {category: meals, amount: 75.01}

  - prompt: "Check if these expenses are within policy: $200 transport, $400 lodging, and $150 entertainment"
    expected_response: "Transport $200: within $200 limit. Lodging $400: within $400 limit. Entertainment $150: within $150 limit. All exactly at policy limits."
    tier: medium
    category: boundary
    expected_tools:
      - name: check_expense_policy
        args: {category: transport, amount: 200}
      - name: check_expense_policy
        args: {category: lodging, amount: 400}
      - name: check_expense_policy
        args: {category: entertainment, amount: 150}

  # ============================================================
  # ERROR RECOVERY — non-existent bookings, unknown users, no-match routes
  # ============================================================

  - prompt: "Cancel booking BK-DOESNOTEXIST"
    expected_response: "Booking BK-DOESNOTEXIST was not found. Please verify the booking ID and try again."
    tier: low
    category: error_handling
    expected_tools:
      - name: cancel_booking
        args: {booking_id: BK-DOESNOTEXIST}

  - prompt: "Show me the details for booking BK-INVALID123"
    expected_response: "Booking BK-INVALID123 was not found. Please check the booking ID."
    tier: low
    category: error_handling
    expected_tools:
      - name: get_booking_details
        args: {booking_id: BK-INVALID123}

  - prompt: "Find flights from Denver to Tokyo and book the cheapest one for Sam Chen"
    expected_response: "No flights found from Denver (DEN) to Tokyo (NRT). Unable to proceed with booking."
    tier: medium
    category: error_handling
    expected_tools:
      - name: search_flights
        args: {origin: DEN, destination: NRT}

  # ============================================================
  # EXPANDED BOOKING COVERAGE
  # ============================================================

  - prompt: "Book flight FL002 for Emily Garcia and FL001 for her colleague James Park"
    expected_response: "Flight FL002 booked for Emily Garcia. Flight FL001 booked for James Park. Both bookings confirmed."
    tier: medium
    category: booking
    expected_tools:
      - name: book_flight
        args: {flight_id: FL002, passenger_name: Emily Garcia}
      - name: book_flight
        args: {flight_id: FL001, passenger_name: James Park}

  - prompt: "Book hotel HT001 for Sarah Lee from June 20 to June 25"
    expected_response: "Hotel HT001 (Grand Hyatt New York) booked for Sarah Lee, June 20-25. 5-night stay confirmed."
    tier: low
    category: booking
    expected_tools:
      - name: book_hotel
        args: {hotel_id: HT001, guest_name: Sarah Lee, checkin: "2026-06-20", checkout: "2026-06-25"}

  - prompt: "Search for flights from SFO to JFK, then book the cheapest one for me — my name is Tom Reyes"
    expected_response: "Found SFO to JFK flights. Cheapest option FL001 ($450) booked for Tom Reyes."
    tier: medium
    category: booking
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: JFK}
      - name: book_flight
        args: {flight_id: FL001, passenger_name: Tom Reyes}

  - prompt: "List all bookings for user EMP001"
    expected_response: "Here are the bookings for user EMP001."
    tier: low
    category: booking
    expected_tools:
      - name: list_all_bookings
        args: {}

  - prompt: "Book hotel HT002 for Mark Chen June 10-12 and submit a $250 lodging expense for EMP003"
    expected_response: "Hotel HT002 booked for Mark Chen (June 10-12). Lodging expense of $250 submitted for EMP003, within $400 policy."
    tier: high
    category: booking
    expected_tools:
      - name: book_hotel
        args: {hotel_id: HT002, guest_name: Mark Chen, checkin: "2026-06-10", checkout: "2026-06-12"}
      - name: check_expense_policy
        args: {category: lodging, amount: 250}
      - name: submit_expense
        args: {user_id: EMP003, category: lodging, amount: 250, description: hotel stay}

  - prompt: "Get the details for my booking — the ID is BK-001"
    expected_response: "Booking BK-001 details retrieved."
    tier: low
    category: booking
    expected_tools:
      - name: get_booking_details
        args: {booking_id: BK-001}

  # ============================================================
  # EXPANDED CANCELLATION COVERAGE
  # ============================================================

  - prompt: "Cancel booking BK-002"
    expected_response: "Booking BK-002 has been cancelled successfully."
    tier: low
    category: cancellation
    expected_tools:
      - name: cancel_booking
        args: {booking_id: BK-002}

  - prompt: "Cancel booking BK-003 and then rebook flight FL001 for the same passenger"
    expected_response: "Booking BK-003 cancelled. Flight FL001 rebooked for Bob Smith."
    tier: medium
    category: cancellation
    expected_tools:
      - name: get_booking_details
        args: {booking_id: BK-003}
      - name: cancel_booking
        args: {booking_id: BK-003}
      - name: book_flight
        args: {flight_id: FL001, passenger_name: Bob Smith}

  - prompt: "I need to cancel my hotel booking BK-005 and find a cheaper hotel in New York instead"
    expected_response: "Hotel booking BK-005 cancelled. Here are cheaper hotel options in New York."
    tier: medium
    category: cancellation
    expected_tools:
      - name: cancel_booking
        args: {booking_id: BK-005}
      - name: search_hotels
        args: {city: New York}

  - prompt: "List all bookings for EMP002 and cancel any hotel bookings"
    expected_response: "Retrieved bookings for EMP002. Hotel bookings identified and cancelled."
    tier: medium
    category: cancellation
    expected_tools:
      - name: list_all_bookings
        args: {}
      - name: cancel_booking
        args: {booking_id: BK-005}

  - prompt: "Cancel booking BK-004, find flights from SFO to LAX, and book the replacement flight for Lisa Wang"
    expected_response: "BK-004 cancelled. SFO-LAX flights found. Replacement flight booked for Lisa Wang."
    tier: high
    category: cancellation
    expected_tools:
      - name: cancel_booking
        args: {booking_id: BK-004}
      - name: search_flights
        args: {origin: SFO, destination: LAX}
      - name: book_flight
        args: {flight_id: FL005, passenger_name: Lisa Wang}

  - prompt: "Show me the details for booking BK-006 so I can decide whether to cancel it"
    expected_response: "Here are the details for booking BK-006."
    tier: low
    category: cancellation
    expected_tools:
      - name: get_booking_details
        args: {booking_id: BK-006}

  # ============================================================
  # EXPANDED BOUNDARY COVERAGE
  # ============================================================

  - prompt: "Submit a $0 meals expense for water at meeting, user ID EMP001"
    expected_response: "A $0 expense is within the meals policy. Expense submitted for EMP001."
    tier: low
    category: boundary
    expected_tools:
      - name: check_expense_policy
        args: {category: meals, amount: 0}
      - name: submit_expense
        args: {user_id: EMP001, category: meals, amount: 0, description: water at meeting}

  - prompt: "Check if a $9999 lodging expense is within policy"
    expected_response: "A $9,999 lodging expense greatly exceeds the $400 policy limit. Requires manager approval."
    tier: low
    category: boundary
    expected_tools:
      - name: check_expense_policy
        args: {category: lodging, amount: 9999}

  - prompt: "Submit a $200.00 transport expense for airport shuttle, user EMP002, and a $200.01 transport expense for return shuttle"
    expected_response: "$200 transport is at policy limit, approved. $200.01 exceeds the $200 limit by $0.01, requires review."
    tier: medium
    category: boundary
    expected_tools:
      - name: check_expense_policy
        args: {category: transport, amount: 200}
      - name: submit_expense
        args: {user_id: EMP002, category: transport, amount: 200, description: airport shuttle}
      - name: check_expense_policy
        args: {category: transport, amount: 200.01}

  - prompt: "Is a $149.99 entertainment expense within policy?"
    expected_response: "A $149.99 entertainment expense is within the $150 corporate policy limit."
    tier: low
    category: boundary
    expected_tools:
      - name: check_expense_policy
        args: {category: entertainment, amount: 149.99}

  - prompt: "Check policy for $100 supplies, then submit it for EMP003. Also check $100.01 supplies."
    expected_response: "$100 supplies is at the limit, approved. $100.01 exceeds the $100 supplies limit by $0.01."
    tier: medium
    category: boundary
    expected_tools:
      - name: check_expense_policy
        args: {category: supplies, amount: 100}
      - name: submit_expense
        args: {user_id: EMP003, category: supplies, amount: 100, description: office supplies}
      - name: check_expense_policy
        args: {category: supplies, amount: 100.01}

  # ============================================================
  # ADDITIONAL SEARCH COVERAGE
  # ============================================================

  - prompt: "Find flights from JFK to LAX on June 15"
    expected_response: "Flights from JFK to LAX on June 15 found."
    tier: low
    category: search
    expected_tools:
      - name: search_flights
        args: {origin: JFK, destination: LAX, date: "2026-06-15"}

  - prompt: "Search for hotels in Chicago under $300 per night"
    expected_response: "The Palmer House in Chicago at $250/night (4.3 rating)."
    tier: low
    category: search
    expected_tools:
      - name: search_hotels
        args: {city: Chicago, max_price: 300}

  # ============================================================
  # ADDITIONAL POLICY COVERAGE
  # ============================================================

  - prompt: "What are the policy limits for all expense categories?"
    expected_response: "Meals: $75. Transport: $200. Lodging: $400. Supplies: $100. Entertainment: $150."
    tier: medium
    category: policy
    expected_tools:
      - name: check_expense_policy
        args: {category: meals, amount: 0}
      - name: check_expense_policy
        args: {category: transport, amount: 0}
      - name: check_expense_policy
        args: {category: lodging, amount: 0}
      - name: check_expense_policy
        args: {category: supplies, amount: 0}
      - name: check_expense_policy
        args: {category: entertainment, amount: 0}

  - prompt: "Is a $300 lodging expense within policy?"
    expected_response: "A $300 lodging expense is within the $400 policy limit."
    tier: low
    category: policy
    expected_tools:
      - name: check_expense_policy
        args: {category: lodging, amount: 300}

  # ============================================================
  # ADDITIONAL ERROR HANDLING + PLANNING + EXPENSE
  # ============================================================

  - prompt: "Submit an expense but I forgot to mention the amount"
    expected_response: "I need additional information to submit an expense. Please provide the amount, category, and your user ID."
    tier: low
    category: error_handling
    expected_tools: []

  - prompt: "Find the cheapest flight to New York, book it for me, check lodging policy, and find a budget hotel"
    expected_response: "Cheapest flight to JFK found and booked. Lodging policy checked. Budget hotel options in New York listed."
    tier: high
    category: planning
    expected_tools:
      - name: search_flights
        args: {origin: SFO, destination: JFK}
      - name: check_expense_policy
        args: {category: lodging, amount: 0}
      - name: search_hotels
        args: {city: New York}

  - prompt: "Submit a $30 transport expense for taxi to airport, user ID EMP001"
    expected_response: "Transport expense of $30 submitted for EMP001. Within $200 policy limit, approved."
    tier: medium
    category: expense
    expected_tools:
      - name: check_expense_policy
        args: {category: transport, amount: 30}
      - name: submit_expense
        args: {user_id: EMP001, category: transport, amount: 30, description: taxi to airport}

  # ============================================================
