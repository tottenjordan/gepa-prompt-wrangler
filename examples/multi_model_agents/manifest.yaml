name: "multi-model-agent-comparison"
description: >
  Compare 5 model tiers on the same travel/expense agent with identical tools.
  Each pair uses the same MCP tool servers but a different LLM model.

agent_module: "examples/multi_model_agents/agents/flash_agent"
eval_data: "examples/multi_model_agents/eval_data/eval_cases.yaml"

pairs:
  - id: "flash-lite-gemini-3.1"
    model: "gemini-3.1-flash-lite"
    description: "Tier 1 — trivial lookups ($0.30/M output tokens)"
    agent_module: "examples/multi_model_agents/agents/lite_agent.py"
    engine_id: "4981388556929859584"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

  - id: "flash-gemini-3.5"
    model: "gemini-3.5-flash"
    description: "Tier 2 — simple tasks with light reasoning ($0.60/M output tokens)"
    agent_module: "examples/multi_model_agents/agents/flash_agent.py"
    engine_id: "6589173623901126656"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

  - id: "pro-gemini-3.1"
    model: "gemini-3.1-pro-preview"
    description: "Tier 3 — moderate reasoning ($10/M output tokens)"
    agent_module: "examples/multi_model_agents/agents/pro_agent.py"
    engine_id: "8730635246715797504"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

  - id: "sonnet-claude-4"
    model: "claude-sonnet-4-6"
    description: "Tier 4 — complex multi-intent analysis ($15/M output tokens)"
    agent_module: "examples/multi_model_agents/agents/sonnet_agent.py"
    engine_id: "7615994338941599744"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

  - id: "opus-claude-4"
    model: "claude-opus-4-6"
    description: "Tier 5 — expert-level planning ($75/M output tokens)"
    agent_module: "examples/multi_model_agents/agents/opus_agent.py"
    engine_id: "7807397323104845824"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

eval_config:
  judge_model: "gemini-3.5-flash"
  response_match_threshold: 0.5
  safety_threshold: 0.8

deploy:
  project: "${GCP_PROJECT_ID}"
  region: "${GCP_REGION}"
  staging_bucket: "${GCP_STAGING_BUCKET}"
