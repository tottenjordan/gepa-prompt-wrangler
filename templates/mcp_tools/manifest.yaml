name: my-mcp-agent-optimization
description: Prompt optimization for my MCP agent

agent_module: .
eval_data: eval_cases.yaml

pairs:
  - id: my-mcp-agent
    model: gemini-3.5-flash
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

eval_config:
  judge_model: gemini-3.5-flash
  response_match_threshold: 0.5
  safety_threshold: 0.8
