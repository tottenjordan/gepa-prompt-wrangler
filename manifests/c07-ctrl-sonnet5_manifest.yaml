name: "c07-ctrl-sonnet5"
description: >
  Campaign 07 — CONTROL arm. Same generic seed as the optimized arms,
  evaluated twice with no optimization between, so every delta it produces is
  the noise floor under campaign 07's own load.

  CLAUDE.md requires a control in every optimization sweep and forbids reusing
  a floor measured on an earlier run: "the dropout that generates the noise
  varies with load and with how many arms run at once." Campaign 06's floor was
  measured on four engines that each drew a perfect health gate -- a ~9% event
  -- so it is optimistic and not transferable to a differently-loaded run.

  See docs/doe/07-cost-quality-frontier.md

agent_module: "examples/multi_model_agents/agents/sonnet_agent"
eval_data: "examples/multi_model_agents/eval_data/eval_cases.yaml"

pairs:
  - id: "c07-ctrl-sonnet5"
    model: "claude-sonnet-5"
    description: "control — prompt unchanged, no optimization"
    agent_module: "examples/multi_model_agents/agents/sonnet_agent"
    # Byte-identical to the optimized arms' seed. That is what makes this a
    # control: the only difference between this arm and c07-sonnet5 is whether
    # GEPA ran.
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

eval_config:
  response_match_threshold: 0.5
  safety_threshold: 0.8

labels:
  lifecycle: "ephemeral"
  campaign: "07"

pipeline:
  secret_id: wrangler-agent-env
  cache_bust: "c07-v2"
  # No optimize stage: this arm exists to measure what an UNCHANGED prompt
  # scores twice, under the same load as the arms it calibrates.
  skip_optimize: true
  # Matched to the optimized arms. A floor measured at a different num_runs
  # does not calibrate them -- campaign 06 measured 0.058 at n=1 against
  # 0.011-0.014 at n=3, a 4-5x difference.
  num_runs: 3

health_gate:
  enabled: true
  required: true
