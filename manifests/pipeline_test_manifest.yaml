name: "pipeline-test-sonnet-opus"
description: >
  Pipeline test with pre-deployed Sonnet and Opus agents.

agent_module: "examples/multi_model_agents/agents/sonnet_agent"
eval_data: "examples/multi_model_agents/eval_data/eval_cases.yaml"

pairs:
  - id: "sonnet"
    model: "claude-sonnet-4-6"
    description: "Claude Sonnet with generic prompt"
    agent_module: "examples/multi_model_agents/agents/sonnet_agent"
    engine_id: "6943994822277464064"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

  - id: "opus"
    model: "claude-opus-4-6"
    description: "Claude Opus with generic prompt"
    agent_module: "examples/multi_model_agents/agents/opus_agent"
    engine_id: "3543777103612739584"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

eval_config:
  judge_model: gemini-2.5-pro
  response_match_threshold: 0.5
  safety_threshold: 0.8

pipeline:
  secret_id: wrangler-agent-env
