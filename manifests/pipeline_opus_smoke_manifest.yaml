name: "pipeline-claude-smoke"
description: >
  Quick pipeline test — opus-4-6 + fable-5 source-based deploy on 5 eval cases.

agent_module: "examples/multi_model_agents/agents/opus_agent"
eval_data: "examples/multi_model_agents/eval_data/eval_cases_smoke.yaml"

pairs:
  - id: "opus"
    model: "claude-opus-4-6"
    description: "Claude Opus 4.6"
    agent_module: "examples/multi_model_agents/agents/opus_agent"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

  - id: "fable"
    model: "claude-fable-5"
    description: "Claude Fable 5"
    agent_module: "examples/multi_model_agents/agents/opus_agent"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

eval_config:
  judge_model: gemini-2.5-pro
  response_match_threshold: 0.5
  safety_threshold: 0.8

pipeline:
  secret_id: wrangler-agent-env
  max_metric_calls: 20
  cache_bust: "v3"
