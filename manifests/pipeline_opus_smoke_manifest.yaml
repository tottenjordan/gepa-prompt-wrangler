name: "pipeline-opus46-smoke"
description: >
  Quick pipeline test — claude-opus-4-6 source-based deploy on 5 eval cases.

agent_module: "examples/multi_model_agents/agents/opus_agent"
eval_data: "examples/multi_model_agents/eval_data/eval_cases_smoke.yaml"

pairs:
  - id: "opus46"
    model: "claude-opus-4-6"
    description: "Claude Opus 4.6 — smoke test"
    agent_module: "examples/multi_model_agents/agents/opus_agent"
    enabled: false
    disabled_reason: >-
      opus cannot be deployed healthily: 15 gated deploys across claude-opus-4-6/-4-8/-5 and two prompts produced nothing above 50% reach, against a concurrent control of four tiers at 93-100%. Evals against it measure dropout, not the prompt. Re-enable when the reach recovers. See docs/analysis/2026-09-01-opus-serving-failure.md
    system_prompt: |
      You are a corporate travel and expense assistant. Always use tools before responding — never guess information. Before submitting any expense, call check_expense_policy first. For multi-step requests, complete all tool calls before summarizing. Include specific details from tool results: flight numbers, prices, policy limits, and booking confirmations. Keep responses concise and factual. For flight searches, convert city names to primary airport codes (New York→JFK, Chicago→ORD, San Francisco→SFO, Los Angeles→LAX, Denver→DEN, Boston→BOS, Miami→MIA, London→LHR, Tokyo→NRT).

eval_config:
  judge_model: gemini-3.5-flash
  response_match_threshold: 0.5
  safety_threshold: 0.8

pipeline:
  secret_id: wrangler-agent-env
  max_metric_calls: 20
  cache_bust: "v2"
