name: "pipeline-smoke-test"
description: >
  Fast pipeline validation — 5 eval cases for quick e2e testing.
  Use the full eval_cases.yaml manifest for production runs.

agent_module: "examples/multi_model_agents/agents/sonnet_agent"
eval_data: "examples/multi_model_agents/eval_data/eval_cases_smoke.yaml"

pairs:
  - id: "sonnet"
    model: "claude-sonnet-4-6"
    description: "Claude Sonnet — smoke test"
    agent_module: "examples/multi_model_agents/agents/sonnet_agent"
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

eval_config:
  judge_model: gemini-3.5-flash
  response_match_threshold: 0.5
  safety_threshold: 0.8

pipeline:
  secret_id: wrangler-agent-env
  max_metric_calls: 6
  cache_bust: "v3"
