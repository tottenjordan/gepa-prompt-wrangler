name: "c07-sonnet5"
description: >
  Campaign 07 — cost/quality frontier. cheap Claude: claude-sonnet-5.
  Identical generic seed across all four arms so the model is the only variable.
  See docs/doe/07-cost-quality-frontier.md

agent_module: "examples/multi_model_agents/agents/sonnet_agent"
eval_data: "examples/multi_model_agents/eval_data/eval_cases.yaml"

pairs:
  - id: "c07-sonnet5"
    model: "claude-sonnet-5"
    description: "cheap Claude — claude-sonnet-5"
    agent_module: "examples/multi_model_agents/agents/sonnet_agent"
    # The generic seed, held byte-identical across all four arms. GEPA has
    # produced a real prompt change exactly once and that run started here,
    # from maximum headroom; runs seeded from an already-optimized prompt
    # returned it unchanged.
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

eval_config:
  response_match_threshold: 0.5
  safety_threshold: 0.8

# Stamped onto every engine this manifest deploys, so the campaign's
# engines can be found and reaped afterwards. `wrangler engines prune`
# lets an ephemeral engine waive the traffic veto -- without this label a
# finished campaign's engines read as "ours, but busy" and are kept
# forever, which is how this project once reached 80 engines.
labels:
  lifecycle: "ephemeral"
  campaign: "07"

pipeline:
  secret_id: wrangler-agent-env
  cache_bust: "c07-v1"
  # 600, not 800. Per-arm arithmetic: deploy 0.3h + eval 1.5h + optimize ~7h +
  # redeploy 0.3h + eval 1.5h = ~10.6h, which fits a night. 800 would not.
  max_metric_calls: 600
  # Set explicitly, not left to the pipeline default of 1. Campaign 06 measured
  # the floor at 0.058 for num_runs=1 against 0.011-0.014 at 3 -- running the
  # frontier at n=1 would measure tier differences against a floor five times
  # larger than it needs to be, which is the outcome 06 flagged as the one that
  # would invalidate this campaign.
  num_runs: 3

health_gate:
  enabled: true
  # An arm that runs on a rejected engine measures dropout, not the model.
  required: true
