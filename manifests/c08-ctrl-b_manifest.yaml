name: "c08-ctrl-b"
description: >
  Campaign 08 — did the criteria fix work? Repeat 2 of 2, control arm.
  CONTROL — same prompt evaluated twice, no optimize stage. Its movement IS the
  noise floor for its batch. CLAUDE.md forbids reusing an earlier campaign's
  floor, so campaign 08 measures its own, one per batch.
  Everything except the criteria is held identical across all six arms:
  claude-sonnet-5, the 78-char generic seed, budget 600, num_runs 3.
  See docs/doe/08-criteria-holdout.md

agent_module: "examples/multi_model_agents/agents/sonnet_agent"
eval_data: "examples/multi_model_agents/eval_data/eval_cases.yaml"

pairs:
  - id: "c08-ctrl-b"
    model: "claude-sonnet-5"
    description: "campaign 08 control — repeat 2"
    agent_module: "examples/multi_model_agents/agents/sonnet_agent"
    # Byte-identical across all six arms. Campaign 07 showed GEPA only produces a
    # real prompt change when started from maximum headroom; a seed that differed
    # between conditions would confound the criteria comparison with seed value.
    system_prompt: "You are a helpful assistant. Use the available tools to answer user questions."

eval_config:
  response_match_threshold: 0.5
  safety_threshold: 0.8

labels:
  lifecycle: "ephemeral"
  campaign: "08"

pipeline:
  secret_id: wrangler-agent-env
  cache_bust: "c08-v2"
  # No optimize stage: eval the same prompt twice under the same load as the
  # optimizing arms in this batch, so whatever it moves by is that batch's floor.
  skip_optimize: true
  # Matched to the optimizing arms. A floor measured at a different num_runs
  # does not calibrate them.
  num_runs: 3

health_gate:
  enabled: true
  # An arm that runs on a rejected engine measures dropout, not the criteria.
  # Redeploy is gated too as of PR #70, so the after-side engine is checked as
  # well -- campaign 07's after-side was ungated and its clean coverage was luck.
  required: true
