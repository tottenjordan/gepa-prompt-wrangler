[project]
name = "gepa-prompt-wrangler"
version = "0.1.0"
description = "Prompt optimization harness for ADK agents — evaluate, compare, and tune system prompts across models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GEPA Team" }]

dependencies = [
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.154.0",
    "google-adk[a2a,agent-identity,eval,mcp]>=2.2.0",
    "google-genai>=1.66.0",
    "litellm>=1.83.14",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.10.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
    "paperbanana>=0.1.2",
    "rouge-score>=0.1.2",
    "anthropic[vertex]>=0.49.0",
    "kfp>=2.16.0",
    "google-cloud-storage>=3.0.0",
    "fastmcp>=2.0.0",
]

[project.scripts]
wrangler = "wrangler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wrangler"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# *.md is excluded because ruff reformats Python code blocks inside Markdown.
# docs/notes/ quotes upstream ADK source verbatim (2-space Google style) as
# evidence; reformatting it to 4-space would make those quotes misleading.
extend-exclude = ["experiments", "outputs", "_geap_build_pkg", "*.md"]

[tool.ruff.lint]
select = ["ALL"]
# Philosophy: every rule that can catch a *bug* stays on. Rules dropped below are
# either stylistic, in conflict with the formatter, or in conflict with a deliberate
# architectural choice in this repo. Each one carries its reason.
ignore = [
    # --- Not our conventions ---
    "D",       # docstring style — not adopting pydocstyle wholesale
    "ANN",     # annotations are enforced by ty, not ruff
    "CPY001",  # copyright notice in every file — not our convention
    "T201",    # print() is the CLI's output mechanism
    "TRY003",  # long messages in exceptions are fine here
    "EM",      # exception message string literals
    "FIX",     # TODO comments are tracked, not banned
    "TD",      # TODO formatting

    # --- Conflict with the formatter ---
    "COM812",  # trailing comma — ruff format owns this
    "ISC001",  # implicit string concat — ruff format owns this
    "E501",    # line length — ruff format owns it; the residue is unsplittable
               # prompt strings, URLs, and log messages

    # --- Conflict with deliberate architecture ---
    "PLC0415", # imports inside functions: KFP components are serialized in isolation
               # and must import locally, and the heavy Google SDKs are lazily imported
               # so `wrangler --help` stays fast
    "TID252",  # relative imports are the intra-package convention throughout wrangler/
    "S603",    # subprocess without shell=True is the *safe* form; this repo shells out
    "S607",    # to gcloud/docker/git by name on purpose
    "S108",    # /tmp paths are correct inside pipeline containers
    "S104",    # MCP servers bind 0.0.0.0 inside containers by design
    "S311",    # random is used for jitter and sampling, never for secrets
    "SLF001",  # the ADK monkey-patches in optimize/optimizer.py must touch privates
    "G004",    # f-strings in log calls — readability preferred over lazy interpolation
    "RUF001",  # em dashes and typographic quotes are intentional in prompts and reports
    "W291",    # ruff format already strips trailing whitespace from code lines, so every
               # surviving hit is INSIDE a prompt string literal (line-wrap artifacts in
               # examples/multi_model_agents/prompts/*.py). Stripping those would change
               # the prompt text, hence the eval scores, hence archived GEPA results.

    # --- Metrics on existing code, not defects ---
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
    "PLR0915", # too many statements
    "PLR0912", # too many branches
    "PLR2004", # magic value comparison
    "C901",    # complexity
    "FBT001",  # boolean positional args are baked into the existing public signatures;
    "FBT002",  # changing them is an API break, not a lint fix
    "FBT003",
    "ARG001",  # unused arguments are normal in callbacks and interface implementations
    "ARG002",
    "ARG005",

    # --- Deferred, tracked as follow-up (see docs/plans/2026-08-20-repo-modernization.md) ---
    "PTH",     # os.path -> pathlib migration: ~170 sites, mechanical but large. Worth
               # doing as its own PR, not smuggled into the toolchain commit.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "SLF001"]        # asserts, magic values, private access
"scripts/*" = ["INP001"]                         # standalone scripts, not a package
# The example agents manipulate sys.path and call load_dotenv() before importing, which
# E402 forbids. That ordering is required for GEAP deployment compatibility.
"examples/*" = ["E402", "INP001"]
"templates/*" = ["INP001"]
"agents/*" = ["INP001"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wrangler --cov-report=term-missing"
