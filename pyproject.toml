[project]
name = "gepa-prompt-wrangler"
version = "0.1.0"
description = "Prompt optimization harness for ADK agents — evaluate, compare, and tune system prompts across models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GEPA Team" }]

dependencies = [
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.154.0",
    "google-adk[a2a,agent-identity,eval,mcp]>=2.2.0",
    "google-genai>=1.66.0",
    "litellm>=1.83.14",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.10.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
    "paperbanana>=0.1.2",
    "rouge-score>=0.1.2",
    "anthropic[vertex]>=0.49.0",
    "kfp>=2.16.0",
    "google-cloud-storage>=3.0.0",
    "fastmcp>=2.0.0",
]

[project.scripts]
wrangler = "wrangler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wrangler"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]
