name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --frozen fails the build if uv.lock is out of sync with pyproject.toml.
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check wrangler/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The interpreters we actually deploy to, and only those.
        #   3.11 -- GEAP runtime, Dockerfile.pipeline, TARGET_PYTHON
        #   3.14 -- all three Cloud Run MCP images (python:3.14-slim)
        # 3.12 and 3.13 were dropped 2026-09-17: nothing runs on them, and the
        # pin-vs-installed comparisons skip off TARGET_PYTHON, so those jobs were a
        # green tick over a quietly reduced suite. uv.lock splits litellm at exactly
        # the 3.14 boundary (1.85.7 below, 1.96.2 at/above), so 3.14 is the entry that
        # was actually load-bearing and missing.
        # tests/test_pipeline_image_pins.py keeps this list honest in both directions.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups --frozen
      - run: uv run pytest tests/ -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uvx pip-audit --strict
