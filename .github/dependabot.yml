version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # google-adk and google-cloud-aiplatform move together and share the
      # ADK internals this repo monkey-patches, so they must be reviewed as
      # one change rather than as separate PRs that each look harmless.
      google-sdks:
        patterns:
          - "google-*"
      dev-tools:
        patterns:
          - "ruff"
          - "ty"
          - "pytest*"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Base images only -- dependabot does not read the pip pins inside a RUN
  # layer. Those are held to uv.lock by tests/test_pipeline_image_pins.py, so a
  # uv bump that moves a version turns the build red rather than drifting the
  # containers silently, which is what happened to google-adk on 2026-09-08.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/examples/multi_model_agents/mcp_servers/search"
      - "/examples/multi_model_agents/mcp_servers/booking"
      - "/examples/multi_model_agents/mcp_servers/expense"
    schedule:
      interval: "monthly"
